name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: booking_test
          POSTGRES_USER: booking
          POSTGRES_PASSWORD: booking
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U booking -d booking_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.4"
          extensions: pdo_pgsql, pgsql, pcntl, posix
          coverage: none
      - run: composer install --prefer-dist --no-interaction --no-progress
      - name: Prepare restricted test database role
        env:
          PGPASSWORD: booking
        run: |
          psql --host=127.0.0.1 --port=5432 --username=booking --dbname=booking_test \
            --set=ON_ERROR_STOP=1 <<'SQL'
          CREATE ROLE booking_app LOGIN PASSWORD 'booking-app-test'
            NOSUPERUSER NOCREATEDB NOCREATEROLE NOINHERIT NOREPLICATION NOBYPASSRLS;
          GRANT USAGE, CREATE ON SCHEMA public TO booking_app;
          CREATE EXTENSION IF NOT EXISTS btree_gist;
          SQL
      - run: cp .env.example .env
      - run: php artisan key:generate
      - run: php artisan test
        env:
          DB_USERNAME: booking_app
          DB_PASSWORD: booking-app-test

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run build

  telegram-worker:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: telegram-worker
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: telegram-worker/requirements.txt
      - run: pip install --requirement requirements.txt
      - run: python -m unittest discover --verbose
