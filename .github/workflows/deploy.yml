name: Deploy to production

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: booking-saas-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: [self-hosted, linux, x64, booking-saas]
    steps:
      - uses: actions/checkout@v4

      - name: Verify Docker
        run: docker compose version

      - name: Create backend environment
        shell: bash
        env:
          APP_KEY: ${{ secrets.APP_KEY }}
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
          DB_APP_PASSWORD: ${{ secrets.DB_APP_PASSWORD }}
          REVERB_APP_KEY: ${{ secrets.REVERB_APP_KEY }}
          REVERB_APP_SECRET: ${{ secrets.REVERB_APP_SECRET }}
          TELEGRAM_MAIN_BOT_TOKEN: ${{ secrets.TELEGRAM_MAIN_BOT_TOKEN }}
          TELEGRAM_LOGIN_CLIENT_ID: ${{ vars.TELEGRAM_LOGIN_CLIENT_ID }}
          GOOGLE_CLIENT_ID: ${{ vars.GOOGLE_CLIENT_ID }}
        run: |
          set -euo pipefail
          : "${APP_KEY:?Add the APP_KEY repository secret}"
          : "${POSTGRES_PASSWORD:?Add the POSTGRES_PASSWORD repository secret}"
          : "${DB_APP_PASSWORD:?Add the DB_APP_PASSWORD repository secret}"
          : "${REVERB_APP_KEY:?Add the REVERB_APP_KEY repository secret}"
          : "${REVERB_APP_SECRET:?Add the REVERB_APP_SECRET repository secret}"
          if [[ ! "$DB_APP_PASSWORD" =~ ^[A-Za-z0-9_-]{32,}$ ]]; then
            echo "DB_APP_PASSWORD must be at least 32 URL-safe characters" >&2
            exit 1
          fi
          cp backend/.env.production backend/.env
          sed -i "s|^APP_KEY=.*|APP_KEY=${APP_KEY}|" backend/.env
          sed -i "s|^DB_USERNAME=.*|DB_USERNAME=booking_app|" backend/.env
          sed -i "s|^DB_PASSWORD=.*|DB_PASSWORD=${DB_APP_PASSWORD}|" backend/.env
          sed -i "s|^REVERB_APP_KEY=.*|REVERB_APP_KEY=${REVERB_APP_KEY}|" backend/.env
          sed -i "s|^REVERB_APP_SECRET=.*|REVERB_APP_SECRET=${REVERB_APP_SECRET}|" backend/.env
          sed -i "s|^TELEGRAM_MAIN_BOT_TOKEN=.*|TELEGRAM_MAIN_BOT_TOKEN=${TELEGRAM_MAIN_BOT_TOKEN}|" backend/.env
          sed -i "s|^TELEGRAM_LOGIN_CLIENT_ID=.*|TELEGRAM_LOGIN_CLIENT_ID=${TELEGRAM_LOGIN_CLIENT_ID}|" backend/.env
          sed -i "s|^GOOGLE_CLIENT_ID=.*|GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID}|" backend/.env

      - name: Write deployment variables
        shell: bash
        env:
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
          DB_APP_PASSWORD: ${{ secrets.DB_APP_PASSWORD }}
        run: |
          set -euo pipefail
          : "${POSTGRES_PASSWORD:?Add the POSTGRES_PASSWORD repository secret}"
          : "${DB_APP_PASSWORD:?Add the DB_APP_PASSWORD repository secret}"
          printf 'POSTGRES_DB=booking\nPOSTGRES_USER=booking\nPOSTGRES_PASSWORD=%s\nDB_APP_PASSWORD=%s\n' \
            "$POSTGRES_PASSWORD" "$DB_APP_PASSWORD" > .env

      - name: Validate demo owner credentials
        shell: bash
        env:
          DEMO_OWNER_EMAIL: ${{ secrets.DEMO_OWNER_EMAIL }}
          DEMO_OWNER_PASSWORD: ${{ secrets.DEMO_OWNER_PASSWORD }}
        run: |
          set -euo pipefail
          : "${DEMO_OWNER_EMAIL:?Add the DEMO_OWNER_EMAIL repository secret}"
          : "${DEMO_OWNER_PASSWORD:?Add the DEMO_OWNER_PASSWORD repository secret}"
          if [[ ! "$DEMO_OWNER_EMAIL" =~ ^[^@]+@[^@]+\.[^@]+$ ]]; then
            echo "DEMO_OWNER_EMAIL must be a valid email address" >&2
            exit 1
          fi
          if [[ ${#DEMO_OWNER_PASSWORD} -lt 12 ]]; then
            echo "DEMO_OWNER_PASSWORD must be at least 12 characters" >&2
            exit 1
          fi

      - name: Build and start containers
        run: docker compose build --pull

      - name: Install backend dependencies
        run: >-
          docker compose run --rm --no-deps
          --user "$(id -u):$(id -g)"
          -e HOME=/tmp
          -e COMPOSER_HOME=/tmp/composer
          app composer install --no-dev --no-interaction --prefer-dist --optimize-autoloader

      - name: Start database services
        run: docker compose up -d postgres redis

      - name: Provision restricted application database role
        shell: bash
        env:
          DB_APP_PASSWORD: ${{ secrets.DB_APP_PASSWORD }}
        run: |
          set -euo pipefail
          for attempt in $(seq 1 30); do
            if docker compose exec -T postgres pg_isready --username booking --dbname booking >/dev/null 2>&1; then
              break
            fi
            sleep 2
          done
          docker compose exec -T postgres pg_isready --username booking --dbname booking
          {
            printf '\\set runtime_password %s\n' "$DB_APP_PASSWORD"
            cat docker/postgres/provision-runtime-role.sql
          } | docker compose exec -T postgres sh -c \
            'psql --set=ON_ERROR_STOP=1 --username "$POSTGRES_USER" --dbname "$POSTGRES_DB"'

      - name: Clear cached configuration
        run: docker compose run --rm --no-deps app php artisan config:clear

      - name: Start containers
        run: docker compose up -d --remove-orphans

      - name: Recreate Telegram webhook services
        run: docker compose up -d --force-recreate backend-nginx telegram-bot-worker

      - name: Verify Telegram webhook reaches the worker
        shell: bash
        run: |
          set -euo pipefail
          status="$(curl --silent --show-error --output /dev/null --write-out '%{http_code}' \
            --request POST \
            http://127.0.0.1:18081/api/v1/telegram/python-webhook/0)"
          if [[ "$status" != "403" ]]; then
            echo "Expected worker response 403 without a webhook secret, got HTTP $status" >&2
            exit 1
          fi

      - name: Run migrations
        shell: bash
        env:
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
        run: >-
          docker compose exec -T
          -e DB_USERNAME=booking
          -e DB_PASSWORD="$POSTGRES_PASSWORD"
          app php artisan migrate --force

      - name: Seed demo tenant and booking catalog
        shell: bash
        env:
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
          DEMO_OWNER_EMAIL: ${{ secrets.DEMO_OWNER_EMAIL }}
          DEMO_OWNER_PASSWORD: ${{ secrets.DEMO_OWNER_PASSWORD }}
        run: |
          set -euo pipefail
          docker compose exec -T \
            -e DB_USERNAME=booking \
            -e DB_PASSWORD="$POSTGRES_PASSWORD" \
            -e DEMO_OWNER_EMAIL="$DEMO_OWNER_EMAIL" \
            -e DEMO_OWNER_PASSWORD="$DEMO_OWNER_PASSWORD" \
            app php artisan db:seed --class=DemoTenantSeeder --force

      - name: Grant application database access
        run: >-
          docker compose exec -T postgres sh -c
          'psql --set=ON_ERROR_STOP=1 --username "$POSTGRES_USER" --dbname "$POSTGRES_DB"'
          < docker/postgres/grant-runtime-role.sql

      - name: Cache configuration
        run: |
          docker compose exec -T app php artisan config:cache
          docker compose exec -T app php artisan route:cache
          docker compose exec -T app php artisan view:cache

      - name: Verify application
        run: >-
          curl --fail
          --resolve booking.iversdev.ru:443:127.0.0.1
          --retry 12 --retry-delay 5 --retry-all-errors
          https://booking.iversdev.ru/
